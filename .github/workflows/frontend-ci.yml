name: Frontend CI / build

on:
  pull_request:
    branches: [ main ] # 내 프로젝트의 브랜치 명에 맞게 수정

jobs:
  build:
    runs-on: ubuntu-latest

    # 1. 이 Job 안의 모든 run 명령어는 frontend 폴더를 기준으로 실행하겠다는 설정입니다.
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24' # 작성해주신 Node 24 버전 유지
        cache: 'npm'       # 캐싱 기능 켜기
        # 2. 캐시를 검사할 영수증 파일(package-lock.json)의 실제 위치를 알려줍니다.
        cache-dependency-path: 'frontend/package-lock.json' 

    - name: Install dependencies
      run: npm ci

    - name: Run Build
      run: npm run build